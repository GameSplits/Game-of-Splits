name = "gos-lockwatch-testnet"
main = "src/index.mjs"
compatibility_date = "2026-11-05"
workers_dev = true

[durable_objects]
bindings = [
  { name = "LOCKWATCH", class_name = "LockwatchDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LockwatchDO"]

[vars]
CHAIN_ID = "46630"
RAT = "0xfB1E167CDA749f7acd8E6FDC8a8Db7FF4a9c36e9"
DRY_RUN = "0"
FALLBACK = "1"
POLL_MS = "8000"
MAX_FEE_GWEI = "1"
# testnet keeper and the old shared key (local runner): lockwatch never sends as these
FORBID_SENDERS = "0xf79640C55805A3dc50F4d07AaA8Dfb52bbAa35E1,0x074d2447775506B25D472Db137817Ee7c05a3A21"
# RPC_URL, LOCKWATCH_KEY, PUSHOVER_* are secrets (set via wrangler/API). Live testnet uses DRY_RUN=0 + FALLBACK=1.

[env.mainnet]
name = "gos-lockwatch-mainnet"
workers_dev = true
# DRY_RUN=0: live sends. RAT is the mainnet Robin Among Thieves from contracts/deployments/4663.json.
# FORBID_SENDERS: the mainnet keeper. Lockwatch has its own key (secret LOCKWATCH_KEY) and refuses to send as these.
vars = { CHAIN_ID = "4663", RAT = "0x586d69120F27e04933684fe38f903ae86Bde7c2F", DRY_RUN = "0", FALLBACK = "1", POLL_MS = "2000", MAX_FEE_GWEI = "1", FORBID_SENDERS = "0x4696ebA115691d7AA5A3bb810F172cdb7DCF21E5" }
# DO binding inherited; redeclare for clarity. Mainnet deploy of this worker needs the owner's yes.

[[env.mainnet.durable_objects.bindings]]
name = "LOCKWATCH"
class_name = "LockwatchDO"
