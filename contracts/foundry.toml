[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 200
fail_on_revert = false

[profile.deep.invariant]
runs = 1000
depth = 500 # run before mainnet

[lint]
lint_on_build = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Verify on Blockscout with:
#   forge verify-contract <addr> <Contract> --verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api/
